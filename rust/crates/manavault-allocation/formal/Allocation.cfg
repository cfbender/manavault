\* TLC configuration for Allocation.tla: two deck cards (one basic land),
\* up to three collection items, quantities up to 2, collection edits on,
\* and the fixed code (see README.md for the `Bugs` switches).
SPECIFICATION Spec

CONSTANTS
    Cards = {c1, c2}
    Basic = {c2}
    MaxItems = 3
    MaxQty = 2
    MaxProxy = 2
    Printings = {A, B}
    CollectionEdits = TRUE
    Bugs = {}

CONSTRAINT StateConstraint

INVARIANTS
    TypeOK
    NotOverAllocated
    AllocationsBacked
    AllocatedItemsUnfiled
    NoConsideringAllocations
    Conservation
    BasicLandsJoinDecks
