[tools]
android-sdk = "latest"
aube = "1.21.0"
cloudflared = "latest"
elixir = "1.20.1-otp-29"
erlang = { version = "29.0.3", install_env = { KERL_CONFIGURE_OPTIONS = "--without-javac --without-odbc --without-wx" } }
git-cliff = "latest"
java = "21"
node = "26.4.0"
resvg = "0.48.1"
rust = { version = "1.99.0", components = "clippy,rustfmt" }
sqlite = "3.53.4"
# Tailwind's standalone CLI builds priv/static/assets/css/app.css for the Rust
# backend (the Elixir app runs the same version through the tailwind hex package).
"github:tailwindlabs/tailwindcss" = { version = "4.3.0", bin = "tailwindcss" }
"npm:backlog.md" = "latest"

[tasks.setup]
description = "Install project tools, Elixir dependencies, database, assets, and build the Rust backend."
run = [
  "mise install",
  "aube install --frozen-lockfile",
  # `mix setup` also builds the frontend (Tailwind + Vite) that both backends serve.
  "mix setup",
  "mise run rust:prebuild",
]

[tasks.dev]
description = "Start the Rust backend on $PORT (default 4000) with the Vite dev server on 5173 and Tailwind in watch mode."
run = "bash ./scripts/dev-rust.sh"

[tasks."dev:elixir"]
description = "Start the Phoenix (reference) development server; it runs Vite and Tailwind as watchers."
run = "mix phx.server"

[tasks.test]
description = "Run the Elixir test suite."
run = "mix test"

[tasks.precommit]
description = "Run tests and linting before committing code."
run = [
  "mix test",
  "mix format --check-formatted",
  "mix credo --strict",
  "aube run vp lint",
  "aube run vp format --check",
  "aubx impeccable detect assets/react/src/",
]

[tasks."rust:check"]
description = "Format-check, lint, and test the Rust workspace."
dir = "rust"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
]

[tasks."rust:schema-db"]
description = "Load priv/repo/structure.sql into rust/target/schema.db for sqlx compile-time query checking."
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd rust
mkdir -p target
rm -f target/schema.db
grep -v '^CREATE TABLE sqlite_' ../priv/repo/structure.sql | sqlite3 target/schema.db
'''

[tasks."rust:sqlx-prepare"]
description = "Dump the Ecto schema to priv/repo/structure.sql and regenerate the sqlx query metadata in rust/.sqlx."
run = '''
#!/usr/bin/env bash
set -euo pipefail
mix ecto.dump
# Migration timestamps differ per machine; blank them so the dump is reproducible.
sed -i -E "s/^(INSERT INTO schema_migrations VALUES\([0-9]+),'[^']*'\);$/\1,NULL);/" priv/repo/structure.sql
mise run rust:sqlx-metadata
'''

[tasks."rust:sqlx-metadata"]
description = "Regenerate rust/.sqlx from the current priv/repo/structure.sql (no Elixir needed)."
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run rust:schema-db
cd rust
rm -rf .sqlx && mkdir .sqlx
# Query macros only re-expand when their crate recompiles.
find crates -name '*.rs' -exec touch {} +
SQLX_OFFLINE=false DATABASE_URL="sqlite://$PWD/target/schema.db?mode=ro" SQLX_OFFLINE_DIR="$PWD/.sqlx" \
  cargo check --workspace --all-targets --locked
'''

[tasks."rust:dev"]
description = "Run only the Rust backend against the development database (port $PORT, default 4000); see `dev` for the full stack."
dir = "rust"
run = "MANAVAULT_ENV=dev MANAVAULT_ROOT=.. cargo run --locked --bin manavault"

[tasks."rust:serve"]
description = "Alias of `dev`: the Rust backend plus the Vite dev server and Tailwind watcher."
run = "bash ./scripts/dev-rust.sh"

[tasks."rust:assets"]
description = "Build the production frontend into priv/static/assets (Tailwind CSS and the Vite bundle)."
run = [
  "tailwindcss --input=assets/css/app.css --output=priv/static/assets/css/app.css --minify",
  "aube run build",
]

[tasks."rust:build"]
description = "Build the release `manavault` binary (rust/target/release/manavault)."
dir = "rust"
run = "cargo build --release --locked --bin manavault"

[tasks."rust:prebuild"]
description = "Compile the Rust server and test binaries (debug) so `rust:test` and `dev` start without a cold build."
dir = "rust"
run = [
  "cargo build --workspace --locked",
  "cargo test --workspace --locked --no-run",
]

[tasks."rust:test"]
description = "Run the Rust test suite."
dir = "rust"
run = "cargo test --workspace --locked"

[tasks.changelog]
description = "Generate CHANGELOG.md for the next major/minor/patch version."
usage = '''
arg "<part>" help="Version part to bump" {
  choices "major" "minor" "patch"
}
'''
run = "bash ./scripts/changelog.sh ${usage_part?}"

[tasks.release]
description = "Generate changelog and release the next major/minor/patch version."
usage = '''
arg "<part>" help="Version part to bump" {
  choices "major" "minor" "patch"
}
'''
run = ["bash ./scripts/changelog.sh ${usage_part?}", "bash ./scripts/bump.sh ${usage_part?}"]

[tasks."setup:native"]
description = "Install JavaScript dependencies and sync Capacitor native projects."
run = "aube install --frozen-lockfile && aube run cap:sync"

[tasks."setup:android-sdk"]
description = "Accept Android SDK licenses and install SDK packages needed by Capacitor/native-run."
run = "yes | sdkmanager --licenses && sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'"

[tasks."android:sync"]
description = "Prepare native web metadata and sync the Capacitor Android project."
run = "aube run cap:sync:android"

[tasks."android:build"]
description = "Build a debug Capacitor Android APK."
run = "aube run android:build:debug"

[tasks."android:build:release"]
description = "Build a signed release Capacitor Android APK."
run = "aube run android:build:release"

[tasks."android:signing:setup"]
description = "Create a local Android release keystore and print the GitHub secrets to save."
run = "aube run android:signing:setup"

[tasks."android:run"]
description = "Build and run the Capacitor Android app on a connected device."
run = "aube run cap:run:android"

[tasks."android:open"]
description = "Open the Capacitor Android project in Android Studio."
run = "aube run cap:open:android"

[tasks."ios:sync"]
description = "Sync the Capacitor iOS project. Requires macOS for native iOS builds."
run = "aube run cap:sync:ios"

[tasks."ios:open"]
description = "Open the Capacitor iOS project in Xcode. Requires macOS."
run = "aube run cap:open:ios"
