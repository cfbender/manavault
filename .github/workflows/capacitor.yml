name: Capacitor

on:
  pull_request:
    paths:
      # Native shell only wraps the web app; web/server-only changes do not alter the APK.
      - ".github/workflows/capacitor.yml"
      - "android/**"
      - "ios/**"
      - "native_www/**"
      - "capacitor.config.json"
      - "scripts/prepare-native-web.mjs"
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      # Tags still run because GitHub does not evaluate path filters for tag pushes.
      - ".github/workflows/capacitor.yml"
      - "android/**"
      - "ios/**"
      - "native_www/**"
      - "capacitor.config.json"
      - "scripts/prepare-native-web.mjs"
  workflow_dispatch:

# Read-only by default so PR-triggered runs never get a write-scoped token.
# Only the tag-gated release job below is granted contents: write.
permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: android-sdk,aube,java,node

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: android-sdk aube java node
          cache: true
      - name: Install Android SDK packages
        run: mise run setup:android-sdk

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Resolve app version
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version")
          artifact_version="${base_version}-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            base_version="${GITHUB_REF_NAME#v}"
            artifact_version="${base_version}"
          fi
          echo "MANAVAULT_VERSION=${base_version}" >> "$GITHUB_ENV"
          echo "MANAVAULT_RELEASE_REPOSITORY=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=${artifact_version}" >> "$GITHUB_ENV"

      - name: Restore Android release keystore
        if: github.ref_type == 'tag'
        shell: bash
        env:
          MANAVAULT_ANDROID_KEYSTORE_BASE64: ${{ secrets.MANAVAULT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${MANAVAULT_ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing MANAVAULT_ANDROID_KEYSTORE_BASE64 secret. Run: mise exec -- aube run android:signing:setup" >&2
            exit 1
          fi

          mkdir -p android/release
          printf '%s' "${MANAVAULT_ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/release/manavault-release.jks
          echo "MANAVAULT_ANDROID_KEYSTORE=${GITHUB_WORKSPACE}/android/release/manavault-release.jks" >> "$GITHUB_ENV"

      - name: Validate Android release keystore
        if: github.ref_type == 'tag'
        shell: bash
        env:
          MANAVAULT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MANAVAULT_ANDROID_KEYSTORE_PASSWORD }}
          MANAVAULT_ANDROID_KEY_ALIAS: ${{ secrets.MANAVAULT_ANDROID_KEY_ALIAS }}
        run: |
          # -storepass:env reads the password from the env var by name, so the
          # secret never appears in the runner's process table (unlike -storepass).
          keytool -list \
            -keystore "${MANAVAULT_ANDROID_KEYSTORE}" \
            -alias "${MANAVAULT_ANDROID_KEY_ALIAS}" \
            -storepass:env MANAVAULT_ANDROID_KEYSTORE_PASSWORD \
            -v

      - name: Build release APK
        if: github.ref_type == 'tag'
        env:
          MANAVAULT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MANAVAULT_ANDROID_KEYSTORE_PASSWORD }}
          MANAVAULT_ANDROID_KEY_ALIAS: ${{ secrets.MANAVAULT_ANDROID_KEY_ALIAS }}
          MANAVAULT_ANDROID_KEY_PASSWORD: ${{ secrets.MANAVAULT_ANDROID_KEYSTORE_PASSWORD }}
        run: mise exec -- aube run android:build:release

      # Google Play holds the app signing key; the AAB is signed with the
      # separate Play upload key. Reuses the web assets synced by the APK step.
      - name: Build release AAB
        if: github.ref_type == 'tag'
        shell: bash
        env:
          MANAVAULT_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANAVAULT_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          MANAVAULT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MANAVAULT_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MANAVAULT_ANDROID_KEY_PASSWORD: ${{ secrets.MANAVAULT_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MANAVAULT_ANDROID_KEY_ALIAS: upload
        run: |
          if [[ -z "${MANAVAULT_PLAY_UPLOAD_KEYSTORE_BASE64}" ]]; then
            echo "Missing MANAVAULT_PLAY_UPLOAD_KEYSTORE_BASE64 secret. See docs/android.md." >&2
            exit 1
          fi
          printf '%s' "${MANAVAULT_PLAY_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > android/release/manavault-upload.jks
          MANAVAULT_ANDROID_KEYSTORE="${GITHUB_WORKSPACE}/android/release/manavault-upload.jks" \
            mise exec -- ./android/gradlew -p android bundleRelease

      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: mise exec -- aube run android:build:debug

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist/native
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/native/manavault-${ARTIFACT_VERSION}-release.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/native/manavault-${ARTIFACT_VERSION}-debug.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manavault-${{ env.ARTIFACT_VERSION }}-${{ github.ref_type == 'tag' && 'release' || 'debug' }}-apk
          path: dist/native/*.apk
          if-no-files-found: error

      - name: Stage AAB
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist/play
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/play/manavault-${ARTIFACT_VERSION}-release.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt dist/play/mapping.txt

      - name: Upload AAB artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manavault-${{ env.ARTIFACT_VERSION }}-release-aab
          path: dist/play/
          if-no-files-found: error

  # Separate, tag-only job holds the contents: write token so PR/branch builds
  # (which only build and upload the artifact) run read-only.
  release:
    name: Attach APK to release
    needs: android
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-apk"
          path: dist/native

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: dist/native/**/*.apk

  # Tag-only job so the Play service-account secret is only exposed to release
  # runs. Play rejects API uploads until the first AAB is uploaded in Play
  # Console by hand; see docs/android.md.
  play:
    name: Upload AAB to Google Play
    needs: android
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check Play service account secret
        env:
          MANAVAULT_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.MANAVAULT_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${MANAVAULT_PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "Missing MANAVAULT_PLAY_SERVICE_ACCOUNT_JSON secret. See docs/android.md." >&2
            exit 1
          fi

      - name: Download AAB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release-aab"
          merge-multiple: true
          path: dist/play

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.MANAVAULT_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.cfb.manavault
          releaseFiles: dist/play/*.aab
          mappingFile: dist/play/mapping.txt
          track: ${{ vars.MANAVAULT_PLAY_TRACK || 'internal' }}
          status: ${{ vars.MANAVAULT_PLAY_RELEASE_STATUS || 'completed' }}
