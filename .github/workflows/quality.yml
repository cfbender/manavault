name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: aube,node

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          install_args: aube node
          cache: true

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Lint, format-check, type-check, test, build, and detect UI anti-patterns
        run: mise run frontend:check

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: rust,sqlite
      CARGO_TERM_COLOR: always
      # Fresh builds gain nothing from incremental caches, which only bloat
      # the rust-cache upload.
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          install_args: rust sqlite
          cache: true

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target

      - name: Check queries, rust/schema.sql, and rust/.sqlx against rust/migrations
        run: |
          mise run rust:sqlx-prepare
          if [ -n "$(git status --porcelain -- rust/.sqlx rust/schema.sql)" ]; then
            git status --short -- rust/.sqlx rust/schema.sql
            echo "::error::rust/schema.sql or rust/.sqlx is stale; run 'mise run rust:sqlx-prepare' and commit the result."
            exit 1
          fi

      - name: Format, lint, and test against the committed query metadata
        run: mise run rust:check

      - name: Build the release binary
        run: mise run rust:build
