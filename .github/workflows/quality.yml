name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit:
    name: Precommit quality gate
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: aube,elixir,erlang,node,resvg

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          install_args: aube elixir erlang node resvg
          cache: true

      - name: Install preview fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Hex and Rebar
        run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force

      - name: Install Elixir dependencies
        run: mise exec -- mix deps.get

      - name: Install JavaScript dependencies
        run: mise exec -- aube install --frozen-lockfile

      - name: Run local precommit quality gate
        run: mise exec -- aube run precommit

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: rust,sqlite
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          install_args: rust sqlite
          cache: true

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target

      - name: Check queries and committed .sqlx metadata against priv/repo/structure.sql
        run: |
          mise run rust:sqlx-metadata
          if [ -n "$(git status --porcelain -- rust/.sqlx)" ]; then
            git status --short -- rust/.sqlx
            echo "::error::rust/.sqlx is stale; run 'mise run rust:sqlx-metadata' and commit the result."
            exit 1
          fi

      - name: Format, lint, and test against the committed query metadata
        run: mise run rust:check

      - name: Build the release binary
        run: mise run rust:build
